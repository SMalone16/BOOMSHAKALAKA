name: Inspect uploaded sprites
on:
  push:
    branches: [feature/pallet-pewter-sprite-runtime]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-sprites.cjs
