name: Test BOOMSHAKALAKA
on:
  push:
    branches: [feature/multiplayer-arcade, feature/pallet-pewter-sprite-runtime, feature/ash-leaf-eight-direction, fix/seven-row-sprite-atlas, main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run sprites:check
      - run: npm run sprites:slice -- all
      - run: node -e "const fs=require('fs'); for(const id of ['pallet-0','pallet-3']){const m=JSON.parse(fs.readFileSync('build/sprite-frames/'+id+'/atlas.json'));if(m.frames.length!==70)process.exit(1)}"
      - uses: actions/upload-artifact@v4
        with:
          name: ash-leaf-sliced-frames
          path: build/sprite-frames/
          retention-days: 7
      - run: node --check scripts/sprite-tools.cjs
      - run: node --check server/index.js
      - run: node --check server/game.js
      - run: node --check server/roster.js
      - run: node --check public/ui.js
      - run: node --check public/arena.js
      - run: node --check public/sprites.js
      - run: node --check public/sprite-lab.js
      - run: node --check public/directional-lab.js
